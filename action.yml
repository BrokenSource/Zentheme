name: zentheme
runs:
  using: composite
  steps:
    - uses: actions/checkout@v6

    - uses: astral-sh/setup-uv@v7

    - run: ln readme.md website/index.md || true
      shell: bash

    - run: uv pip install git+https://github.com/BrokenSource/Zentheme/
      shell: bash

    - run: zensical build
      shell: bash

    - run: mv site _site
      shell: bash
