[project]
name         = "zentheme"
version      = "1"
license      = "MIT"
readme       = "readme.md"
classifiers  = ["Private :: Do Not Upload"]
dependencies = [
    "python-frontmatter==1.3.0",
    "tdewolff-minify==2.24.12",
    "zensical",
]

[project.scripts]
zentheme = "zentheme.__main__:main"

[project.entry-points."mkdocs.themes"]
zentheme = "zentheme.theme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["zentheme"]
