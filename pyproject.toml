[project]
name         = "pages"
description  = "🌎 Website utilities and theme"
authors      = [{name="Tremeschin"}]
version      = "1"
classifiers  = ["Private :: Do Not Upload"]
readme       = "readme.md"
license      = "MIT"
requires-python = ">=3.10"
dependencies = [
    "zensical",
]

[dependency-groups]
dev = [
    "python-frontmatter==1.3.0",
    "tdewolff-minify==2.24.12",
    "playwright==1.60.0",
    "typst",
]

[project.scripts]
pages-make = "zentheme.__main__:main"

[project.entry-points."mkdocs.themes"]
zentheme = "pages.theme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
