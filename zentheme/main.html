{% extends "base.html" %}

{% block styles %}
  {{ super() }}
  <style>
    body {
      text-align: justify;
    }

    h2 {
      color: var(--md-accent-fg-color) !important;
    }

    /* Spread content tabs to full width */
    .tabbed-labels--linked label {
      text-align: center;
      flex: 1;
    }

    /* Less bold admonition titles */
    .md-typeset .admonition-title {
      font-weight: 450 !important;
    }
    .filename {
      font-weight: 450 !important;
    }

  </style>
{% endblock %}
