extends: material
variant: modern
language: en

font:
  text: Inter
  code: Cascadia Code

icon:
  logo: octicons/package-16
  tag:
    default: material/tag

features:
  - announce.dismiss
  - content.code.copy
  - content.footnote.tooltips
  - content.tabs.link
  - content.tooltips
  - navigation.expand
  - navigation.footer
  - navigation.indexes
  - navigation.instant
  - navigation.instant.prefetch
  - navigation.instant.progress
  - navigation.path
  - navigation.sections
  - navigation.tabs
  - navigation.top
  - search.highlight
  - toc.follow

palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: lucide/sun-moon
      name: Switch to light mode

  - media: "(prefers-color-scheme: light)"
    primary: indigo
    accent: light-blue
    scheme: catppuccin-latte
    toggle:
      icon: lucide/sun
      name: Switch to dark mode

  - media: "(prefers-color-scheme: dark)"
    primary: indigo
    accent: light-blue
    scheme: catppuccin-macchiato
    toggle:
      icon: lucide/moon
      name: Switch to light mode
